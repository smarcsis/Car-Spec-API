<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Car Spec Finder</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="page">
        <header class="hero">
            <div class="container">
                <h1>Car Spec Finder</h1>
                <p class="subtitle">Search here</p>
            </div>
        </header>

        <main class="container">
            <section class="search-panel">
                <label for="carInput" class="search-label">Search for a car</label>

                <div class="search-row">
                    <input type="text" id="carInput" placeholder="Try Audi RS6, GT-R, AWD..." />
                    <button id="searchButton">Search</button>
                </div>
            </section>

            <section class="filters-panel">
                <h2>Filters</h2>
                <p class="coming-soon">More filters coming soon.</p>
            </section>

            <section class="results-section">
                <div id="result" class="result-grid"></div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
